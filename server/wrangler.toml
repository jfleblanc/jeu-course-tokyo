name = "course"
main = "worker.js"
compatibility_date = "2026-11-01"

routes = [{ pattern = "course.jfleblanc.com", custom_domain = true }]

# Les fichiers du jeu (construits par « npm run build »), servis directement par Cloudflare.
# Une adresse qui ne correspond à aucun fichier (/salon/…, /api/…) arrive au programme worker.js.
[assets]
directory = "../dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SALONS"
class_name = "Salon"

[[durable_objects.bindings]]
name = "CLASSEMENT"
class_name = "Classement"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salon", "Classement"]
