name: Construire, tester et mettre en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d261d50f8bad89cc6fb239c3ffded660
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances (versions épinglées)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Vérifier les types et construire
        run: npm run build
      - name: Test de fumée (le jeu démarre, la voiture roule, aucune erreur console)
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - name: Mettre en ligne sur Cloudflare (course.jfleblanc.com) — seulement si le secret CLOUDFLARE_API_TOKEN existe
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          BASE=/ npx vite build --outDir dist-cf
          npx --yes wrangler@4 deploy --config server/wrangler.toml
          echo "Jeu publié sur Cloudflare." >> "$GITHUB_STEP_SUMMARY"
      - name: Vérifier le serveur de jeu (course.jfleblanc.com) — n'empêche pas la publication
        continue-on-error: true
        run: node scripts/check-server.mjs
      - name: Garder la capture d'écran du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-test
          path: smoke-test.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
